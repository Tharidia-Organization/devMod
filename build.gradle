spotbugs {
    toolVersion = "4.8.3"
    effort = com.github.spotbugs.snom.Effort.valueOf("MAX")           // Thorough analysis
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf("MEDIUM")   // Report medium and high priority bugs
    ignoreFailures = true    // Report but don't fail build (warning mode)
    excludeFilter = file("config/spotbugs/exclude.xml")
}

spotbugsMain {

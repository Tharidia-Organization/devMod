// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("file://${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Enable useful warnings, disable only non-actionable noise:
    // - processing: annotation processor output
    // - path: classpath element warnings (Gradle manages this)
    // Note: unchecked, this-escape, removal handled via @SuppressWarnings where needed
    options.compilerArgs += [
        '-Xlint:all',
        '-Xlint:-processing',
        '-Xlint:-path'
    ]
}

// Configure JUnit 5 testing
def testOutputStoreDir = layout.buildDirectory.dir("test-results/test/binary")
def fsOps = project.services.get(org.gradle.api.file.FileSystemOperations)
test {
    dependsOn 'generateBuildProperties'
    notCompatibleWithConfigurationCache("Test classpath relies on generated artifacts; cache reuse drops main classes.")
    useJUnitPlatform {
        // Exclude load/stress tests from normal test runs - they can fail due to timing
        // in CI or constrained environments. Run explicitly with:
        // ./gradlew test --tests "com.devmod.mailbox.BroadcastLoadTest"
        excludeTags 'load'
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    // Avoid executing nested/helper classes as standalone tests.
    exclude '**/*$*'
    // Clear test output store to avoid EOFException during XML report generation.
    doFirst {
        fsOps.delete {
            delete(testOutputStoreDir)
        }
    }
    // Allow Byte Buddy to instrument Java 21 classes in Mockito inline mocks.
    jvmArgs '-Dnet.bytebuddy.experimental=true'
    // Silence dynamic agent loading warnings from Byte Buddy in tests.
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    // Silence JVM class data sharing warning in test output.
    jvmArgs '-Xshare:off'
    // Reduce concurrency for JVM tests to avoid occasional XML write collisions
    // that may happen on some filesystems or CI environments.
    maxParallelForks = 1
    jacoco {
        excludes = [
            'net/minecraft/*',
            'com/mojang/*'
        ]
    }
    finalizedBy jacocoTestReport
}

// Checkstyle Configuration
// Enforces import ordering: java → javax → external → minecraft → neoforged → devmod
checkstyle {
    toolVersion = "10.21.1"
    configFile = file("config/checkstyle/checkstyle.xml")
    // Report but don't fail build (warning mode)
    ignoreFailures = true
    showViolations = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = false
    }
}

// Error Prone + NullAway Configuration
// Provides compile-time null-safety verification for @Nonnull annotated code
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        // NullAway configuration
        option("NullAway:AnnotatedPackages", "com.devmod")
        option("NullAway:TreatGeneratedAsUnannotated", "true")
        option("NullAway:ExcludedFieldAnnotations", "org.mockito.Mock,org.mockito.Spy")
        // Exclude packages from NullAway - complex null handling patterns
        // Compat modules use lazy reflection, core systems have nullable fields by design
        option("NullAway:UnannotatedSubPackages", "com.devmod.compat,com.devmod.testing,com.devmod.gametest,com.devmod.arena,com.devmod.combat,com.devmod.util,com.devmod.actions,com.devmod.stats,com.devmod.endurance,com.devmod.party,com.devmod.config,com.devmod.runtime")

        // All checks in warning mode initially (don't break build)
        // Run: ./gradlew compileJava 2>&1 | grep -E "warning:|error:" to see issues
        allErrorsAsWarnings = true

        // NullAway - the main null-safety checker
        check("NullAway", net.ltgt.gradle.errorprone.CheckSeverity.WARN)

        // All Error Prone checks enabled; fix warnings instead of suppressing.
    }
}

// Make checkstyle only run on main source (not generated or test code)
tasks.named('checkstyleMain').configure {
    source = sourceSets.main.java
}

// Disable checkstyle on tests (focused on main source quality)
tasks.named('checkstyleTest').configure {
    enabled = false
}

// DD41: Coverage Policy Configuration
// - 80% line coverage for core logic (cleanup, template, validation)
// - 60% line coverage for MC-dependent code (monitor, world, entity)
// - 50% line coverage for network/UI code
jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    // Exclude Minecraft-dependent and generated code from coverage reports
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                // Generated code
                '**/mixin/**',
                '**/generated/**',
                // Minecraft integration (lower coverage expected)
                '**/client/**',
                '**/network/**',
                '**/integration/**'
            ])
        }))
    }
}


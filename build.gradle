    implementation('org.eclipse.jetty:jetty-server:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty:jetty-servlet:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty:jetty-webapp:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty:jetty-xml:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty:jetty-http:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty:jetty-io:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty:jetty-util:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty:jetty-security:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty.websocket:websocket-jetty-server:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty.websocket:websocket-jetty-common:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty.websocket:websocket-jetty-api:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty.websocket:websocket-core-server:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty.websocket:websocket-core-common:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation('org.eclipse.jetty.websocket:websocket-servlet:11.0.20') {
        exclude group: 'org.slf4j'
    }
    implementation 'org.jetbrains:annotations:24.1.0'
    jarJar("io.javalin:javalin:[5.6.5]") {
        exclude group: 'org.slf4j'
    }
    // Jetty dependencies for Javalin (required for NeoForge module system)
    jarJar("org.eclipse.jetty.toolchain:jetty-jakarta-servlet-api:[5.0.2]")
    jarJar("org.eclipse.jetty:jetty-server:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty:jetty-servlet:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty:jetty-webapp:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty:jetty-xml:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty:jetty-http:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty:jetty-io:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty:jetty-util:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty:jetty-security:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty.websocket:websocket-jetty-server:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty.websocket:websocket-jetty-common:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty.websocket:websocket-jetty-api:[11.0.20]") {
        exclude group: 'org.slf4j'
    }
    jarJar("org.eclipse.jetty.websocket:websocket-core-server:[11.0.20]") {

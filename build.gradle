plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
    id 'idea'
    id 'jacoco'  // DD41: Coverage Policy
    id 'checkstyle'  // Import ordering enforcement
    id 'net.ltgt.errorprone' version '4.1.0'  // Error Prone static analysis
    id 'com.github.spotbugs' version '6.0.7'  // SpotBugs static analysis
}

// Optional: shared JaCoCo rules + coverageSummary task.
apply from: 'jacoco-coverage-rules.gradle'

import org.gradle.api.DefaultTask
import org.gradle.api.tasks.*
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.Property

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    mavenCentral()

    // JEI / Patchouli and other BlameJared-hosted mods
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }

    // Athena CTM library (Team Resourceful)
    maven {
        name = "TeamResourceful"
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }

    // GeckoLib - Advanced entity and block animations
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    // Modrinth Maven for Distant Horizons API
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // DevAuth for Microsoft authentication in dev environment
    maven {
        name = "DevAuth"
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
    }

    // Tharidia mods (Easy-Diet, etc.) - GitHub Packages or local maven
    maven {
        name = "Tharidia"
        url = uri("https://maven.pkg.github.com/Tharidia-Organization/*")
        credentials {
            username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
            password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: ""
        }
    }
    // Fallback: local maven for Easy-Diet development
    mavenLocal()
}

// Check if GitHub credentials are available for optional dependencies
def hasGitHubCredentials = (System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: "").length() > 0
if (!hasGitHubCredentials) {
    logger.warn("[DevMod] GitHub credentials not found - optional dependencies (Easy-Diet) will be skipped")
    logger.warn("[DevMod] Set GITHUB_TOKEN env var or gpr.key property to enable all optional dependencies")
}

// NOTE: Easy-Diet integration now uses reflection (EasyDietApi.java)
// No source exclusions needed - all files compile without Easy-Diet JAR

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Gate 2 test: DuckDB strict mode with invalid path
        clientStrictMode {
            client()
            systemProperty 'devmod.duckdb.path', '/invalid/path/test.duckdb'
            systemProperty 'devmod.duckdb.ndjson_fallback', 'false'
            systemProperty 'devmod.duckdb.fallback_on_error', 'false'
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'devmod.template.dir', project.file('config/devmod/arena_templates').absolutePath

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Ensure test source set always includes main outputs (some plugins can drop it).
sourceSets.test.compileClasspath += sourceSets.main.output
sourceSets.test.runtimeClasspath += sourceSets.main.output

// ============================================================================
// Admin Panel Auto-Start
// ============================================================================
// Task to start the admin panel (Vite dev server) in background
abstract class StartAdminPanelTask extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getAdminPanelDir()

    @TaskAction
    void startPanel() {
        def panelDir = adminPanelDir.get().asFile
        if (!panelDir.exists()) {
            logger.warn("Admin panel directory not found: ${panelDir}")
            return
        }

        // Check if node_modules exists, if not run npm install
        def nodeModules = new File(panelDir, "node_modules")
        if (!nodeModules.exists()) {
            logger.lifecycle("Installing admin panel dependencies...")
            def installProcess = new ProcessBuilder('npm', 'install')
                .directory(panelDir)
                .inheritIO()
                .start()
            installProcess.waitFor()
        }

        // Start the Vite dev server in background
        logger.lifecycle("Starting admin panel at http://localhost:3001/")
        def processBuilder = new ProcessBuilder('npm', 'run', 'dev')
        processBuilder.directory(panelDir)
        processBuilder.redirectErrorStream(true)
        def process = processBuilder.start()

        // Give it a moment to start
        Thread.sleep(2000)
        logger.lifecycle("Admin panel started (PID: ${process.pid()})")
    }
}

tasks.register('startAdminPanel', StartAdminPanelTask) {
    group = 'devmod'
    description = 'Starts the admin panel dev server in the background'
    adminPanelDir = layout.projectDirectory.dir('admin-panel')
}

// Hook into runServer to start admin panel first
tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn 'startAdminPanel'
}

// DD67: Deprecation milestone enforcement
// M1 (warning): -Xlint:deprecation (always enabled)
// M2 (error): -Werror (via -PdeprecationAsError)
// M3 (removal): legacy code check in CI
tasks.withType(JavaCompile).configureEach { compileTask ->
    // DD67 M1: Always enable deprecation warnings
    compileTask.options.compilerArgs += ["-Xlint:deprecation"]

    // Optional: enable all lint warnings via -PenableLint
    if (project.hasProperty("enableLint")) {
        compileTask.options.compilerArgs += ["-Xlint:all"]
        // Show full paths in diagnostics for easier CLI consumption
        compileTask.options.compilerArgs += ["-Xdiags:verbose"]
    }

    // DD67 M2: Treat deprecation warnings as errors
    if (project.hasProperty("deprecationAsError")) {
        compileTask.options.compilerArgs += ["-Werror"]
    }
}

// DD67 M3: Legacy call-site check (opt-in via -PlegacyCheck)
tasks.register("legacyCallCheck", JavaExec) {
    group = "verification"
    description = "Detect legacy arena API call-sites (WrapperAnalyzer)."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.devmod.arena.migration.LegacyCallCheck"
    if (project.hasProperty("legacyMax")) {
        systemProperty "devmod.legacy.max", project.property("legacyMax")
    }
    if (project.hasProperty("legacySourceRoot")) {
        systemProperty "devmod.legacy.root", project.property("legacySourceRoot")
    }
    if (project.hasProperty("legacyReport")) {
        systemProperty "devmod.legacy.report", project.property("legacyReport")
    }
}

if (project.hasProperty("legacyCheck")) {
    tasks.named("check").configure {
        dependsOn tasks.named("legacyCallCheck")
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Ensure tests see the same classpath (NeoForge/Minecraft) as main sources
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
}

// Add localRuntime dependencies to NeoForge run configurations
afterEvaluate {
    neoForge.runs.configureEach { run ->
        run.additionalRuntimeClasspathConfiguration.extendsFrom(configurations.localRuntime)
    }
}

dependencies {
    // JUnit 5 for unit testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Mockito for mocking Minecraft classes in unit tests
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'

    // SLF4J for test logging (required by DuckDB classes)
    testImplementation 'org.slf4j:slf4j-api:2.0.9'

    // Annotations used in test helpers (ResourceLocation mock)
    testImplementation 'javax.annotation:javax.annotation-api:1.3.2'

    // JSR-305 null-safety annotations (@Nonnull, @Nullable) for main sources
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Optional annotation deps used by log4j to avoid missing-class warnings at compile time
    compileOnly 'biz.aQute.bnd:biz.aQute.bnd.annotation:6.4.0'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.3'
    compileOnly 'org.osgi:org.osgi.annotation.versioning:1.1.0'

    // CTM removed - Athena non funzionava correttamente

    // GeckoLib - Advanced entity and block model animations
    // Enables Bedrock Edition .geo.json models with unlimited rotations, bone hierarchies, and animations
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.4"

    // DevAuth - Microsoft authentication for dev environment
    // Added as JAR in run/mods folder (not gradle dependency to avoid module conflicts)

    // Error Prone compiler + NullAway plugin for compile-time null-safety verification
    errorprone 'com.google.errorprone:error_prone_core:2.24.1'
    errorprone 'com.uber.nullaway:nullaway:0.11.3'

    // Allow test classes to access main source classes (for non-Minecraft unit tests)
    testImplementation sourceSets.main.output

    // DuckDB - Embedded analytics database for telemetry storage
    // Native Java, no JNI issues, excellent for time-series analytics
    // v1.4.3.0 universal JAR (~81 MB) includes all platforms
    // Platform-specific JARs available: windows_amd64, linux_amd64, macos_universal
    implementation 'org.duckdb:duckdb_jdbc:1.4.3.0'
    localRuntime 'org.duckdb:duckdb_jdbc:1.4.3.0'

    // Javalin and JWT for API server (needed in localRuntime for NeoForge classloader)
    // Javalin 5.x uses Jetty 11, Javalin 6.x uses Jetty 12 - using 5.6.5 for Jetty 11 compatibility
    localRuntime('io.javalin:javalin:5.6.5') { exclude group: 'org.slf4j' }
    localRuntime 'org.eclipse.jetty.toolchain:jetty-jakarta-servlet-api:5.0.2'
    localRuntime('org.eclipse.jetty:jetty-server:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty:jetty-servlet:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty:jetty-webapp:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty:jetty-xml:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty:jetty-http:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty:jetty-io:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty:jetty-util:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty:jetty-security:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty.websocket:websocket-jetty-server:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty.websocket:websocket-jetty-common:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty.websocket:websocket-jetty-api:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty.websocket:websocket-core-server:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty.websocket:websocket-core-common:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime('org.eclipse.jetty.websocket:websocket-servlet:11.0.20') { exclude group: 'org.slf4j' }
    localRuntime 'org.jetbrains:annotations:24.1.0'
    localRuntime 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    localRuntime 'io.jsonwebtoken:jjwt-api:0.12.3'
    localRuntime 'io.jsonwebtoken:jjwt-impl:0.12.3'
    localRuntime 'io.jsonwebtoken:jjwt-gson:0.12.3'
    localRuntime 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    localRuntime 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    localRuntime 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    // NeoForge will resolve DuckDB at runtime via the standard dependency classpath
    testImplementation 'org.duckdb:duckdb_jdbc:1.4.3.0'

    // Gson - JSON serialization for REST API responses (used by dashboard server)
    // NOTE: Gson is already provided by Minecraft/NeoForge, so we only need compileOnly
    // DO NOT use jarJar for Gson - it causes module conflicts at runtime
    compileOnly 'com.google.code.gson:gson:2.10.1'

    // Distant Horizons API - compile-only for soft dependency (optional compatibility)
    // API v4.0.1 supports 1.21-1.21.1 on NeoForge
    compileOnly "maven.modrinth:distanthorizons:2.3.0-b-1.21.1"

    // Tharidia Easy-Diet - REFLECTION-BASED integration (no compile-time dependency needed)
    // EasyDietApi uses reflection to access Easy-Diet classes at runtime
    // This allows DevMod to compile and run without Easy-Diet being present
    //
    // NOTE: The compileOnly dependency below is OPTIONAL - only needed if you want
    // IDE auto-completion during development. Comment out if Easy-Diet JAR unavailable.
    // if (hasGitHubCredentials) {
    //     compileOnly "com.THproject:tharidia_easydiet:0.1.0-alpha"
    // }

    // Player Animator (KosmX) - compile-only for SpotBugs analysis + optional compat
    // Provides dev.kosmx.playerAnim.api.layered.IAnimatedPlayer
    compileOnly "maven.modrinth:playeranimator:2.0.4+1.21.1-forge"

    // GUI Scaler - Auto-scales GUI based on screen resolution (dev testing)
    // https://github.com/zendiik/gui-scaler
    localRuntime "maven.modrinth:auto-gui-scaler:1.21.1-1.0.1"

    // Javalin - Lightweight HTTP server for REST API (admin panel backend)
    // NOTE: These are compileOnly - downloaded at runtime by JavalinBootstrap
    // to keep the mod JAR lightweight (~3MB instead of ~10MB)
    compileOnly('io.javalin:javalin:5.6.5') { exclude group: 'org.slf4j' }
    compileOnly 'org.eclipse.jetty.toolchain:jetty-jakarta-servlet-api:5.0.2'
    compileOnly('org.eclipse.jetty:jetty-server:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty:jetty-servlet:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty:jetty-webapp:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty:jetty-xml:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty:jetty-http:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty:jetty-io:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty:jetty-util:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty:jetty-security:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty.websocket:websocket-jetty-server:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty.websocket:websocket-jetty-common:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty.websocket:websocket-jetty-api:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty.websocket:websocket-core-server:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty.websocket:websocket-core-common:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly('org.eclipse.jetty.websocket:websocket-servlet:11.0.20') { exclude group: 'org.slf4j' }
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'

    // NOTE: All jarJar dependencies removed - they cause module conflicts in dev environment
    // with other mods (Kotlin For Forge, Plasmo Voice, etc.) that include the same libraries.
    // The implementation/localRuntime dependencies above provide these at compile and dev runtime.
    // For production JAR, these would need to be re-enabled or dependencies bundled differently.

    // Jackson - JSON serialization for Javalin REST API
    // NOTE: compileOnly - downloaded at runtime by JavalinBootstrap
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    compileOnly 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'

    // JWT for API authentication
    // NOTE: compileOnly - downloaded at runtime by JavalinBootstrap
    compileOnly 'io.jsonwebtoken:jjwt-api:0.12.3'
    compileOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    compileOnly 'io.jsonwebtoken:jjwt-gson:0.12.3'
    // NOTE: Removed jarJar for jjwt - causes module conflict with Plasmo Voice
    // which also includes JWT libraries (error: "reads more than one module named jjwt.gson")

    // NOTE: Removed Caffeine dependency (replaced with ConcurrentHashMap-based cache in HitHelper)
    // This avoids ModDevPlugin 2.0 compatibility issues with external dependencies

    // NOTE: Removed ImGui-Java dependency - macOS GLSL 410 core profile has rendering issues
    // with imgui-java 1.89.0 in Minecraft. Using native Minecraft screens instead.

    // JEI integration (compile against API; use full jar at dev runtime)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            jei_version            : jei_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("file://${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Enable useful warnings, disable only non-actionable noise:
    // - processing: annotation processor output
    // - path: classpath element warnings (Gradle manages this)
    // Note: unchecked, this-escape, removal handled via @SuppressWarnings where needed
    options.compilerArgs += [
        '-Xlint:all',
        '-Xlint:-processing',
        '-Xlint:-path'
    ]

}

// Configure JUnit 5 testing
def testOutputStoreDir = layout.buildDirectory.dir("test-results/test/binary")
def fsOps = project.services.get(org.gradle.api.file.FileSystemOperations)
test {
    dependsOn 'generateBuildProperties'
    notCompatibleWithConfigurationCache("Test classpath relies on generated artifacts; cache reuse drops main classes.")
    useJUnitPlatform {
        // Exclude load/stress tests from normal test runs - they can fail due to timing
        // in CI or constrained environments. Run explicitly with:
        // ./gradlew test --tests "com.devmod.mailbox.BroadcastLoadTest"
        excludeTags 'load'
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    def testResultsSuffix = System.getProperty("devmod.testResultsSuffix")
    if (testResultsSuffix != null && !testResultsSuffix.isBlank()) {
        reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/test-${testResultsSuffix}")
        reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/test-${testResultsSuffix}")
    }
    // Avoid executing nested/helper classes as standalone tests.
    exclude '**/*$*'
    // Clear test output store to avoid EOFException during XML report generation.
    doFirst {
        fsOps.delete {
            delete(testOutputStoreDir)
        }
    }
    // Allow Byte Buddy to instrument Java 21 classes in Mockito inline mocks.
    jvmArgs '-Dnet.bytebuddy.experimental=true'
    // Silence dynamic agent loading warnings from Byte Buddy in tests.
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    // Silence JVM class data sharing warning in test output.
    jvmArgs '-Xshare:off'
    // Reduce concurrency for JVM tests to avoid occasional XML write collisions
    // that may happen on some filesystems or CI environments.
    maxParallelForks = 1
    jacoco {
        excludes = [
            'net/minecraft/*',
            'com/mojang/*'
        ]
    }
    finalizedBy jacocoTestReport
}

// Checkstyle Configuration
// Enforces import ordering: java → javax → external → minecraft → neoforged → devmod
checkstyle {
    toolVersion = "10.21.1"
    configFile = file("config/checkstyle/checkstyle.xml")
    // Report but don't fail build (warning mode)
    ignoreFailures = true
    showViolations = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = false
    }
}

// Error Prone + NullAway Configuration
// Provides compile-time null-safety verification for @Nonnull annotated code
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        // NullAway configuration
        option("NullAway:AnnotatedPackages", "com.devmod")
        option("NullAway:TreatGeneratedAsUnannotated", "true")
        option("NullAway:ExcludedFieldAnnotations", "org.mockito.Mock,org.mockito.Spy")
        // Exclude packages from NullAway - complex null handling patterns
        // Compat modules use lazy reflection, core systems have nullable fields by design
        option("NullAway:UnannotatedSubPackages", "com.devmod.compat,com.devmod.testing,com.devmod.gametest,com.devmod.arena,com.devmod.combat,com.devmod.util,com.devmod.actions,com.devmod.stats,com.devmod.endurance,com.devmod.party,com.devmod.config,com.devmod.runtime")

        // All checks in warning mode initially (don't break build)
        // Run: ./gradlew compileJava 2>&1 | grep -E "warning:|error:" to see issues
        allErrorsAsWarnings = true

        // NullAway - the main null-safety checker
        check("NullAway", net.ltgt.gradle.errorprone.CheckSeverity.WARN)

        // All Error Prone checks enabled; fix warnings instead of suppressing.
    }
}

// Make checkstyle only run on main source (not generated or test code)
tasks.named('checkstyleMain').configure {
    source = sourceSets.main.java
}

// Disable checkstyle on tests (focused on main source quality)
tasks.named('checkstyleTest').configure {
    enabled = false
}

// SpotBugs Configuration

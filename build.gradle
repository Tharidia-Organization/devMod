tasks.register('checkDesignTokensColors') {
    group = 'verification'
    description = 'Fails if hex color literals appear outside DesignTokens.'

    // Capture project values at configuration time for configuration cache compatibility
    def projectDir = layout.projectDirectory.asFile
    def allowed = designTokenColorAllowlist.collect { new File(projectDir, it).canonicalFile }
    def sourceTree = fileTree('src/main/java').matching { pattern ->
        pattern.include('**/*.java')
        pattern.exclude(designTokenColorAllowlist)
    }

    doLast {
        def violations = []

        sourceTree.each { file ->
            if (allowed.contains(file.canonicalFile)) {
                return
            }
            int lineNumber = 0
            file.eachLine('UTF-8') { line ->
                lineNumber++
                def matcher = (line =~ /0x[0-9A-Fa-f_]+/)
                while (matcher.find()) {
                    def literal = matcher.group()
                    def digits = literal.substring(2).replace('_', '')
                    if (digits.length() == 6 || digits.length() == 8) {
                        def endIndex = matcher.end()
                        if (endIndex < line.length()) {
                            char suffix = line.charAt(endIndex)
                            if (suffix == 'L' || suffix == 'l') {
                                continue
                            }
                        }
                        def relPath = projectDir.toPath().relativize(file.toPath()).toString()
                        violations << "${relPath}:${lineNumber}: ${literal}"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                "Hex color literals found outside DesignTokens:\n" +
                violations.join('\n') +
                "\nMove them into DesignTokens.java (or SharedColorTokens) and reference via tokens."
            )
        }
    }
}

tasks.named('check') {
    dependsOn 'checkDesignTokensColors'
}

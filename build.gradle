        html {
            required = true
            outputLocation = file("build/reports/spotbugs/main.html")
        }
        xml {
            required = true
            outputLocation = file("build/reports/spotbugs/main.xml")
        }
    }
}

// Disable SpotBugs on test code (focused on production code quality)
spotbugsTest {
    enabled = false
}


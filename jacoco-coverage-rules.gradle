/**
 * JaCoCo Coverage Rules Configuration
 * DD41: Coverage Policy - 80% core, 60% MC-dependent, 50% network/UI
 *
 * Apply this file in build.gradle:
 *   apply from: 'jacoco-coverage-rules.gradle'
 */

import groovy.xml.XmlSlurper

jacoco {
    toolVersion = "0.8.11"
}

// Configure JaCoCo report generation
jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    // Exclude generated and Minecraft-dependent code from coverage reports
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                // Generated code
                '**/mixin/**',
                '**/generated/**',
                // Minecraft integration (lower coverage expected)
                '**/client/**',
                '**/network/**',
                '**/integration/**'
            ])
        }))
    }
}

// Configure coverage verification rules
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    violationRules {
        // Rule 1: Core Arena Logic - 80% minimum (DD41)
        rule {
            enabled = true
            element = 'PACKAGE'

            includes = [
                'com.devmod.arena.cleanup.*',
                'com.devmod.arena.template.*',
                'com.devmod.arena.registry.*',
                'com.devmod.arena.validation.*',
                'com.devmod.arena.builder.*'
            ]

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }

        // Rule 2: Minecraft-Dependent Code - 60% minimum
        rule {
            enabled = true
            element = 'PACKAGE'

            includes = [
                'com.devmod.arena.monitor.*',
                'com.devmod.arena.world.*',
                'com.devmod.arena.entity.*'
            ]

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }

        // Rule 3: Network/UI Code - 50% minimum
        rule {
            enabled = true
            element = 'PACKAGE'

            includes = [
                'com.devmod.arena.ui.*',
                'com.devmod.arena.hud.*',
                'com.devmod.arena.dashboard.*'
            ]

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

// Make check depend on coverage verification
check.dependsOn jacocoTestCoverageVerification

// Custom task to print coverage summary
task coverageSummary {
    dependsOn jacocoTestReport

    doLast {
        def reportFile = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
        if (reportFile.exists()) {
            def parser = new XmlSlurper(false, false)
            try { parser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false) } catch (Exception ignored) {}
            try { parser.setFeature("http://xml.org/sax/features/external-general-entities", false) } catch (Exception ignored) {}
            try { parser.setFeature("http://xml.org/sax/features/external-parameter-entities", false) } catch (Exception ignored) {}
            try { parser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false) } catch (Exception ignored) {}
            def xml = parser.parse(reportFile)
            def counters = xml.counter

            println "\n========== Coverage Summary =========="
            counters.each { counter ->
                def type = counter.@type.text()
                def missed = counter.@missed.text() as int
                def covered = counter.@covered.text() as int
                def total = missed + covered
                def ratio = total > 0 ? (covered * 100.0 / total) : 0
                printf "%-12s: %6.2f%% (%d/%d)\n", type, ratio, covered, total
            }
            println "======================================"
        }
    }
}

// Coverage thresholds documentation (DD41)
ext.coverageThresholds = [
    core: [
        description: 'Core arena logic (cleanup, template, registry, validation, builder)',
        line: 0.80,
        packages: [
            'com.devmod.arena.cleanup',
            'com.devmod.arena.template',
            'com.devmod.arena.registry',
            'com.devmod.arena.validation'
        ]
    ],
    mcDependent: [
        description: 'Minecraft-dependent code (monitor, world, entity)',
        line: 0.60,
        packages: [
            'com.devmod.arena.monitor',
            'com.devmod.arena.world',
            'com.devmod.arena.entity'
        ]
    ],
    networkUi: [
        description: 'Network and UI code (arena UI/HUD/dashboard)',
        line: 0.50,
        packages: [
            'com.devmod.arena.ui',
            'com.devmod.arena.hud',
            'com.devmod.arena.dashboard'
        ]
    ]
]
